name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG="github.com/fred01/quick-translate/internal/version"
          mkdir -p dist
          BIN="qt${EXT}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.Date=${DATE}" \
            -o "dist/${BIN}" ./cmd/qt

      - name: Archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          cd dist
          BIN="qt${EXT}"
          if [ "$GOOS" = "windows" ]; then
            ARCHIVE="qt-${GOOS}-${GOARCH}.zip"
            zip -9 "$ARCHIVE" "$BIN"
          else
            ARCHIVE="qt-${GOOS}-${GOARCH}.tar.gz"
            tar -czf "$ARCHIVE" "$BIN"
          fi
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          rm "$BIN"

      - uses: actions/upload-artifact@v7
        with:
          name: qt-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-merged
          merge-multiple: true

      - name: Compute aggregate SHA256SUMS
        run: |
          cd dist-merged
          rm -f SHA256SUMS
          shasum -a 256 qt-*.tar.gz qt-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-merged/*
          generate_release_notes: true

  update-formula:
    name: Update Homebrew formula on main
    needs: release
    runs-on: ubuntu-latest
    steps:
      # HOMEBREW_TAP_TOKEN is a fred01 PAT (Contents:write). Its owner must be
      # allowed to bypass branch protection on main for the push below to land.
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          path: dist-merged
          merge-multiple: true

      - name: Render Formula/qt.rb
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          cd dist-merged
          SHA_DARWIN_ARM64=$(awk '{print $1}' qt-darwin-arm64.tar.gz.sha256)
          SHA_DARWIN_AMD64=$(awk '{print $1}' qt-darwin-amd64.tar.gz.sha256)
          SHA_LINUX_ARM64=$(awk '{print $1}' qt-linux-arm64.tar.gz.sha256)
          SHA_LINUX_AMD64=$(awk '{print $1}' qt-linux-amd64.tar.gz.sha256)
          cd ..
          mkdir -p Formula
          cat > Formula/qt.rb <<EOF
          # This file is generated by .github/workflows/release.yml on tag push.
          # Manual edits will be overwritten on the next release.
          class Qt < Formula
            desc "Translate Russian into clear, natural, polished business English"
            homepage "https://github.com/fred01/quick-translate"
            version "${V}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/fred01/quick-translate/releases/download/v${V}/qt-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/fred01/quick-translate/releases/download/v${V}/qt-darwin-amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/fred01/quick-translate/releases/download/v${V}/qt-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/fred01/quick-translate/releases/download/v${V}/qt-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "qt"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/qt version")
            end
          end
          EOF
          cat Formula/qt.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/qt.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "Update Homebrew formula for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
